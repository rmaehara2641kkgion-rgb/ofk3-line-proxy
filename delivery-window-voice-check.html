<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配送時間帯 音声確認</title>
<style>
  body { font-family: sans-serif; margin: 16px; max-width: 640px; }
  button { font-size: 18px; padding: 10px 14px; margin: 4px 4px 4px 0; }
  .row { margin: 12px 0; }
  .ok { color: #166534; } .ng { color: #b91c1c; }
  pre { background: #f3f4f6; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>配送時間帯 音声確認</h1>
<p>この端末の音声と、スキャン結果の読み上げ文を確認するページです。データの読込・通信・保存は行いません。読み上げるのは下の固定フレーズだけです。</p>
<div class="row" id="status">確認中...</div>
<div class="row">音声: <select id="voice"></select></div>
<div class="row">
  <button data-t="8時から12時！">8時から12時！</button>
  <button data-t="14時から16時！">14時から16時！</button>
  <button data-t="16時から18時！">16時から18時！</button>
  <button data-t="時間指定なし！">時間指定なし！</button>
  <button data-t="確認できません！">確認できません！</button>
</div>
<div class="row"><button id="rapid">連続3回(最新優先)</button></div>
<div class="row">開始までの時間(ms): <span id="timing">-</span></div>
<div class="row">結果: <span id="fail">-</span></div>
<pre id="voices"></pre>
<script src="./delivery-window-voice.js"></script>
<script src="./delivery-window-speaker.js"></script>
<script>
(function () {
  var statusEl = document.getElementById('status'), sel = document.getElementById('voice');
  var spk = DeliveryWindowSpeaker.createSpeaker(
    { synth: window.speechSynthesis, Utterance: window.SpeechSynthesisUtterance, now: function () { return performance.now(); } },
    {
      onTiming: function (t) { document.getElementById('timing').textContent = Math.round(t.toStartMs); },
      onFail: function (r) { var f = document.getElementById('fail'); f.textContent = '失敗: ' + r; f.className = 'ng'; },
      onVoiceChange: render
    });
  function render() {
    var st = spk.getStatus(), list = spk.listVoices(), i;
    statusEl.innerHTML = '';
    var msg = !st.supported ? '音声合成に対応していません' :
      (st.male ? '男性声を検出: ' + st.voiceName : (st.voiceName ? '男性声は未検出 (使用: ' + st.voiceName + ')' : '日本語音声がありません'));
    statusEl.textContent = msg; statusEl.className = 'row ' + (st.male ? 'ok' : 'ng');
    sel.innerHTML = '';
    for (i = 0; i < list.length; i++) {
      var o = document.createElement('option'); o.value = list[i].name;
      o.textContent = list[i].name + (list[i].male ? ' (男性)' : '') + (list[i].local ? '' : ' [通信あり]');
      if (list[i].name === st.voiceName) o.selected = true;
      sel.appendChild(o);
    }
    document.getElementById('voices').textContent = '日本語音声: ' + list.length + '件';
  }
  sel.onchange = function () { spk.setPreferredVoice(sel.value); };
  function say(t) { document.getElementById('fail').textContent = '-'; document.getElementById('fail').className = ''; var r = spk.speak(t, { scanAt: performance.now() }); if (!r.ok) { document.getElementById('fail').textContent = '失敗: ' + r.reason; document.getElementById('fail').className = 'ng'; } }
  var btns = document.querySelectorAll('button[data-t]'), k;
  for (k = 0; k < btns.length; k++) btns[k].onclick = function () { say(this.getAttribute('data-t')); };
  document.getElementById('rapid').onclick = function () { say('8時から12時！'); say('14時から16時！'); say('時間指定なし！'); };
  render();
}());
</script>
</body>
</html>
