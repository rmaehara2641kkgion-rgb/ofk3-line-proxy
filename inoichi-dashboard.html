<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0b14">
  <title>INO-1 Prototype 1 — 調査用Dashboard</title>
  <link rel="icon" href="./assets/inoichi-app.ico?v=app-shuriken" sizes="any">
  <link rel="stylesheet" href="./inoichi-dashboard.css">
</head>
<body class="inoichi-dashboard-page">
  <div id="inoichi-dashboard"></div>

  <script src="./inoichi-detection-core.js"></script>
  <script src="./inoichi-detection-rules.js"></script>
  <script src="./inoichi-fleet-adapter.js"></script>
  <script src="./inoichi-alert-store.js"></script>
  <script src="./inoichi-notification-adapter.js"></script>
  <script src="./duty-hours-format.js?v=20261026-duty-display"></script>
  <script src="./inoichi-dashboard.js"></script>
  <script>
    (function () {
      'use strict';
      if (typeof window.InoichiDashboard === 'undefined') {
        document.getElementById('inoichi-dashboard').innerHTML = '<div style="padding:20px;color:#ff4d6d;">InoichiDashboard is not loaded.</div>';
        return;
      }
      window.InoichiDashboard.initDashboard({
        container: document.getElementById('inoichi-dashboard'),
        sampleMode: true,
        dataSource: 'サンプルデータ（本番未接続）',
        now: '2026-10-07T12:00:00.000Z'
      });
    })();
  </script>
  <script src="./inoichi-rolling-live.js"></script>
</body>
</html>
