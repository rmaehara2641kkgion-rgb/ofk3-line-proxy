<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スキャナー入力確認</title>
<style>
  body { font-family: sans-serif; margin: 16px; max-width: 680px; }
  input { font-size: 22px; padding: 8px; width: 100%; box-sizing: border-box; }
  button { font-size: 16px; padding: 8px 12px; margin: 4px 4px 4px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td, th { border: 1px solid #cbd5e1; padding: 4px 6px; text-align: left; }
  pre { background: #f3f4f6; padding: 8px; white-space: pre-wrap; }
  .hint { color: #475569; font-size: 13px; }
</style>
</head>
<body>
<h1>スキャナー入力確認</h1>
<p class="hint">下の欄をクリックして、バーコードを1個ずつスキャンしてください。接頭辞・接尾辞・終端キー・入力速度を調べます。<br>
<strong>数字はすべて「9」に置き換えて表示します</strong>(荷物番号は画面にも記録にも残りません)。データの読込・保存・通信は行いません。</p>
<input id="field" type="text" autocomplete="off" placeholder="ここにスキャン" autofocus>
<div style="margin:8px 0;">
  <button id="clear">結果を消去</button>
  <button id="copy">要約をコピー</button>
</div>
<table>
  <thead><tr><th>#</th><th>形(数字は9)</th><th>長さ</th><th>終端キー</th><th>キー間隔 平均/最大(ms)</th><th>修飾キー</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<h3>要約(コピーして共有できます。荷物番号は含みません)</h3>
<pre id="summary">スキャンすると表示されます。</pre>
<script>
(function () {
  var field = document.getElementById('field'), rows = document.getElementById('rows'), summary = document.getElementById('summary');
  var scans = [], cur = null;
  var TERMINATORS = { Enter: 1, Tab: 1 };

  function mask(s) {
    var out = '', i, c;
    for (i = 0; i < s.length; i++) {
      c = s.charAt(i);
      out += (c >= '0' && c <= '9') ? '9' : (c.charCodeAt(0) < 32 ? '<' + c.charCodeAt(0) + '>' : c);
    }
    return out;
  }
  function begin() { cur = { text: '', times: [], mods: {}, terminator: null, startedAt: 0 }; }
  function finish(term) {
    if (!cur || (!cur.text && !term)) { return; }
    cur.terminator = term || 'なし(入力停止で確定)';
    var gaps = [], i, sum = 0, max = 0;
    for (i = 1; i < cur.times.length; i++) { var g = cur.times[i] - cur.times[i - 1]; gaps.push(g); sum += g; if (g > max) max = g; }
    scans.push({ shape: mask(cur.text), len: cur.text.length, term: cur.terminator, avg: gaps.length ? Math.round(sum / gaps.length) : 0, max: Math.round(max), mods: Object.keys(cur.mods).join('+') || '-' });
    cur = null; render();
  }
  function render() {
    var i, h = '';
    for (i = 0; i < scans.length; i++) {
      var s = scans[i];
      h += '<tr><td>' + (i + 1) + '</td><td></td><td>' + s.len + '</td><td></td><td>' + s.avg + ' / ' + s.max + '</td><td></td></tr>';
    }
    rows.innerHTML = h;
    var trs = rows.querySelectorAll('tr');
    for (i = 0; i < trs.length; i++) { trs[i].children[1].textContent = scans[i].shape; trs[i].children[3].textContent = scans[i].term; trs[i].children[5].textContent = scans[i].mods; }
    if (!scans.length) { summary.textContent = 'スキャンすると表示されます。'; return; }
    var shapes = {}, terms = {}, maxGap = 0, lens = {};
    for (i = 0; i < scans.length; i++) { shapes[scans[i].shape] = (shapes[scans[i].shape] || 0) + 1; terms[scans[i].term] = (terms[scans[i].term] || 0) + 1; lens[scans[i].len] = 1; if (scans[i].max > maxGap) maxGap = scans[i].max; }
    var lines = ['スキャン数: ' + scans.length, '形(数字は9): ' + JSON.stringify(shapes), '終端キー: ' + JSON.stringify(terms), '長さの種類: ' + Object.keys(lens).join(','), '最大キー間隔(ms): ' + maxGap, 'ブラウザ: ' + navigator.userAgent.replace(/\(.*?\)/, '(...)').slice(0, 80)];
    summary.textContent = lines.join('\n');
  }
  field.addEventListener('keydown', function (e) {
    if (!cur) begin();
    if (e.shiftKey) cur.mods.Shift = 1; if (e.ctrlKey) cur.mods.Ctrl = 1; if (e.altKey) cur.mods.Alt = 1;
    if (TERMINATORS[e.key]) { e.preventDefault(); finish(e.key); field.value = ''; return; }
    if (e.key && e.key.length === 1) { cur.text += e.key; cur.times.push(performance.now()); }
    else if (e.key === 'Backspace') { cur.text = cur.text.slice(0, -1); }
    else if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt') { /* modifier */ }
    else if (e.key) { cur.text += '<' + e.key + '>'; }
  });
  var idle = null;
  field.addEventListener('keyup', function () {
    if (idle) clearTimeout(idle);
    idle = setTimeout(function () { if (cur && cur.text) { finish(null); field.value = ''; } }, 600);
  });
  field.addEventListener('paste', function (e) {
    var t = (e.clipboardData && e.clipboardData.getData('text')) || '';
    e.preventDefault(); begin(); cur.text = t.replace(/[\r\n]+$/, ''); cur.mods.Paste = 1; finish('(貼り付け)'); field.value = '';
  });
  document.getElementById('clear').onclick = function () { scans = []; cur = null; field.value = ''; render(); field.focus(); };
  document.getElementById('copy').onclick = function () { try { navigator.clipboard.writeText(summary.textContent); } catch (e) { /* manual copy */ } };
  render();
}());
</script>
</body>
</html>
